apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payment-api-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:yazicigurkan/banking-dotnet-payment-api.git
    targetRevision: TEST
    path: deploy/k8s/chart
    helm:
      releaseName: payment-api
      valueFiles:
        - ../values-test.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: payment-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
