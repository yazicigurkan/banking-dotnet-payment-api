name: Secret Readiness Check

on:
  workflow_dispatch:
    inputs:
      target_environment:
        required: true
        type: choice
        options: [DEV, TEST, PROD]
        default: DEV

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    env:
      NUGET_USERNAME: ${{ secrets.NUGET_USERNAME }}
      NUGET_PASSWORD: ${{ secrets.NUGET_PASSWORD }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GRAPHNODE_BASE_URL: ${{ secrets.GRAPHNODE_BASE_URL }}
      GRAPHNODE_TOKEN: ${{ secrets.GRAPHNODE_TOKEN }}
      NEXUS_BASE_URL: ${{ secrets.NEXUS_BASE_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
      TWISTLOCK_CONSOLE_URL: ${{ secrets.TWISTLOCK_CONSOLE_URL }}
      TWISTLOCK_USER: ${{ secrets.TWISTLOCK_USER }}
      TWISTLOCK_PASSWORD: ${{ secrets.TWISTLOCK_PASSWORD }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      WINDOWS_DEPLOY_USERNAME: ${{ secrets.WINDOWS_DEPLOY_USERNAME }}
      WINDOWS_DEPLOY_PASSWORD: ${{ secrets.WINDOWS_DEPLOY_PASSWORD }}
    steps:
      - name: Verify required secrets exist
        run: |
          missing=0
          for name in \
            NUGET_USERNAME NUGET_PASSWORD \
            SONAR_HOST_URL SONAR_TOKEN \
            GRAPHNODE_BASE_URL GRAPHNODE_TOKEN \
            NEXUS_BASE_URL NEXUS_USERNAME NEXUS_PASSWORD \
            HARBOR_REGISTRY HARBOR_USERNAME HARBOR_PASSWORD \
            TWISTLOCK_CONSOLE_URL TWISTLOCK_USER TWISTLOCK_PASSWORD \
            JIRA_BASE_URL JIRA_USER_EMAIL JIRA_API_TOKEN \
            KUBE_CONFIG WINDOWS_DEPLOY_USERNAME WINDOWS_DEPLOY_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "missing: ${name}"
              missing=1
            else
              echo "present: ${name}"
            fi
          done
          exit "$missing"
